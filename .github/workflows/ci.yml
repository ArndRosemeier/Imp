name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The version is the number of merges, so the build reads the whole history.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # The local server renders films and reads clips with ffmpeg; its tests run it for real.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - run: pnpm test:coverage
      - run: pnpm --filter @imp/web build
      - run: pnpm --filter @imp/server build
      # The packaged server must start by itself, without the workspace around it.
      - run: cp -r apps/server/dist/imp-server "$RUNNER_TEMP/imp-server" && node "$RUNNER_TEMP/imp-server/imp.mjs" --help
